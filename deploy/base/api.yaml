apiVersion: v1
kind: ConfigMap
metadata:
  name: mavenflow-api
data:
  PORT: "3001"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: mavenflow
  DB_USER: mavenflow
  CORS_ORIGIN: "*" # overridden per environment
---
apiVersion: v1
kind: Service
metadata:
  name: mavenflow-api
  labels:
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mavenflow-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Do not start the API before the database accepts connections
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for db; sleep 2; done"]
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: mavenflow-api
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: mavenflow-api
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mavenflow-db
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mavenflow-api
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mavenflow-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
